<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Chatbot - Frontend Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 20px 30px;
            border-bottom: 2px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.assistant {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            border-radius: 0 0 20px 20px;
        }
        
        .input-wrapper {
            display: flex;
            gap: 10px;
        }
        
        #message-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #message-input:focus {
            border-color: #667eea;
        }
        
        #send-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        #send-button:active {
            transform: translateY(0);
        }
        
        #send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin-right: 5px;
            animation: bounce 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .status.connected {
            color: #28a745;
        }
        
        .status.error {
            color: #dc3545;
        }

        .tool-call {
            background: #e3f2fd;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #1976d2;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 8px 12px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Agentic Chatbot</h1>
            <p>AI Assistant with BigQuery Integration</p>
        </div>
        
        <div class="chat-container" id="chat-container">
            <div class="status" id="status">Connecting...</div>
            <div class="typing-indicator" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type your message here..." 
                    disabled
                />
                <button id="send-button" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const statusElement = document.getElementById('status');
        const typingIndicator = document.getElementById('typing-indicator');

        // Initialize connection
        async function initializeConnection() {
            try {
                // Test if backend is running
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (data.status === 'healthy') {
                    setStatus('Connected', 'connected');
                    
                    // Start conversation
                    await startConversation();
                    
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                    messageInput.focus();
                }
            } catch (error) {
                setStatus('Connection failed. Make sure the backend is running.', 'error');
                console.error('Connection error:', error);
            }
        }

        // Start conversation
        async function startConversation() {
            try {
                const response = await fetch(`${API_BASE_URL}/chat/start`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    addMessage('assistant', 'Hello! I\'m your AI assistant with BigQuery integration. How can I help you analyze data today?');
                }
            } catch (error) {
                console.error('Error starting conversation:', error);
                addMessage('assistant', 'Error starting conversation. Please refresh the page.');
            }
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            
            // Show typing indicator
            typingIndicator.classList.add('active');
            sendButton.disabled = true;
            messageInput.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/chat/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        timeout: 120
                    })
                });

                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.classList.remove('active');
                
                // Add assistant response
                if (data.text) {
                    addMessage('assistant', data.text, data.tool_calls);
                } else if (data.error) {
                    addMessage('assistant', `Error: ${data.error}`, null, true);
                }
            } catch (error) {
                typingIndicator.classList.remove('active');
                addMessage('assistant', `Error: ${error.message}`, null, true);
            } finally {
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // Add message to chat
        function addMessage(role, text, toolCalls = null, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            // Add tool calls info if present
            if (toolCalls && toolCalls.length > 0) {
                toolCalls.forEach(call => {
                    const toolDiv = document.createElement('div');
                    toolDiv.className = call.error ? 'error-message' : 'tool-call';
                    toolDiv.textContent = call.error 
                        ? `Tool Error (${call.tool}): ${call.error}`
                        : `Tool: ${call.tool}`;
                    contentDiv.appendChild(toolDiv);
                });
            }
            
            messageDiv.appendChild(contentDiv);
            
            // Insert before typing indicator
            chatContainer.insertBefore(messageDiv, typingIndicator);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Set status
        function setStatus(message, className = '') {
            statusElement.textContent = message;
            statusElement.className = `status ${className}`;
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) {
                sendMessage();
            }
        });

        // Initialize on page load
        window.addEventListener('load', initializeConnection);
    </script>
</body>
</html>
